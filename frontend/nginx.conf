# nginx settings for the frontend container

server {
    # Listen for web traffic on port 80.
    listen 80;

    # Serve files (index.html, index.js) from this folder.
    root /usr/share/nginx/html;

    # Any request starting with /api/ is passed on to the backend.
    # "backend" is the name of the backend Service in k8s/backend.yaml -
    # Kubernetes DNS turns that name into the Service's internal address.
    # The trailing "/" strips /api, so /api/colour becomes /colour on the backend.
    location /api/ {
        proxy_pass http://backend:5000/;
    }
}
